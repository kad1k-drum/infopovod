<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Фон с исправлениями для iOS */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        .background-container img,
        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(110%);
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
        
        /* Затемнение фона */
        .background-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.9) 0%,
                rgba(0,0,0,0.6) 50%,
                rgba(0,0,0,0.9) 100%
            );
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        /* Логотип */
        .logo-container {
            text-align: center;
            margin-top: 1vh;
            animation: fadeInDown 1.5s ease-out;
            max-width: 80%;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        .logo-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            -webkit-font-smoothing: antialiased;
        }
        
        .logo-image {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
        
        .tagline {
            font-size: 1.2rem;
            color: #ccc;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Кнопка входа */
        .enter-button {
            margin-bottom: 20vh;
            animation: fadeInUp 1.5s ease-out;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        .enter-btn {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: normal;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .enter-btn:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
        
        .enter-btn:active {
            transform: translateY(0);
        }
        
        /* Анимации */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Специфичные стили для iOS */
        @supports (-webkit-touch-callout: none) {
            body {
                /* Предотвращение bounce-эффекта на iOS */
                position: fixed;
                width: 100%;
                height: 100%;
            }
            
            .background-container {
                /* Фикс для фона на iOS */
                -webkit-backface-visibility: hidden;
                -webkit-perspective: 1000;
            }
            
            .enter-btn {
                /* Улучшение внешнего вида кнопки на iOS */
                -webkit-touch-callout: none;
            }
        }

        /* Фикс для Safari */
        @media not all and (min-resolution:.001dpcm) { 
            @supports (-webkit-appearance:none) {
                .background-container::after {
                    /* Фикс градиента в Safari */
                    background: linear-gradient(
                        to bottom,
                        rgba(0,0,0,0.95) 0%,
                        rgba(0,0,0,0.7) 50%,
                        rgba(0,0,0,0.95) 100%
                    );
                }
            }
        }
        
        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            
            .logo-image {
                max-height: 150px;
            }
            
            .tagline {
                font-size: 0.9rem;
            }
            
            .enter-btn {
                padding: 0.7rem 1.8rem;
                font-size: 0.9rem;
            }
            
            .logo-container {
                margin-top: 20vh;
            }
            
            .enter-button {
                margin-bottom: 25vh;
            }

            /* Фикс для мобильного Safari */
            @supports (-webkit-touch-callout: none) {
                body {
                    min-height: -webkit-fill-available;
                }
                
                .background-container {
                    height: -webkit-fill-available;
                }
            }
        }
        
        @media (max-width: 480px) {
            .logo-text {
                font-size: 1.8rem;
            }
            
            .logo-image {
                max-height: 120px;
            }
            
            .tagline {
                font-size: 0.8rem;
            }
            
            .enter-btn {
                padding: 0.6rem 1.5rem;
                font-size: 0.85rem;
            }
        }

        /* Предотвращение масштабирования на iOS */
        @media (max-width: 768px) {
            body {
                -webkit-text-size-adjust: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ================================ -->
    <!-- НАСТРОЙКА ФОНА - ВЫБЕРИТЕ ОДИН ВАРИАНТ -->
    <!-- ================================ -->
    
    <!-- ВАРИАНТ 1: ВИДЕО ФОН -->
    <!--
    <div class="background-container">
        <video autoplay muted loop playsinline webkit-playsinline>
            <source src="videos/background-video.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео
        </video>
    </div>
    -->
    
    <!-- ВАРИАНТ 2: ИЗОБРАЖЕНИЕ ФОН -->
    <div class="background-container">
        <img src="startf.jpg" alt="Фон">
    </div>
    
    <!-- ================================ -->
    <!-- НАСТРОЙКА ЛОГОТИПА - ВЫБЕРИТЕ ОДИН ВАРИАНТ -->
    <!-- ================================ -->
    
    <!-- ВАРИАНТ 1: ТЕКСТОВЫЙ ЛОГОТИП -->
    <!--
    <div class="logo-container">
        <div class="logo-text">НАЗВАНИЕ ГРУППЫ</div>
        <div class="tagline">Музыкальная группа</div>
    </div>
    -->
    
    <!-- ВАРИАНТ 2: ИЗОБРАЖЕНИЕ ЛОГОТИП -->
    <div class="logo-container">
        <img src="logo.png" alt="Логотип" class="logo-image">
    </div>
    
    <!-- ================================ -->
    <!-- КОНЕЦ НАСТРОЕК -->
    <!-- ================================ -->
    
    <!-- Кнопка входа -->
    <div class="enter-button">
        <a href="main.html" class="enter-btn">открыть сайт</a>
    </div>

    <script>
        // Просто предзагрузка основной страницы
        window.addEventListener('load', function() {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = 'main.html';
            document.head.appendChild(link);
        });

        // Фиксы для iOS
        document.addEventListener('DOMContentLoaded', function() {
            // Предотвращение масштабирования на iOS
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(e) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, false);

            // Фикс для фона на iOS
            const backgroundContainer = document.querySelector('.background-container');
            if (backgroundContainer) {
                backgroundContainer.style.webkitTransform = 'translateZ(0)';
                backgroundContainer.style.transform = 'translateZ(0)';
            }

            // Фикс высоты для мобильного Safari
            function setVH() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
            
            setVH();
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', setVH);
        });

        // Предотвращение контекстного меню на изображениях
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
